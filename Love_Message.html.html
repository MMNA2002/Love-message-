<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رسالة حب</title>
    <style>
        body {
            font-family: 'Cairo', sans-serif; /* استخدام خط قريب */
            text-align: center;
            margin-top: 50px;
            background-color: #ffe4e1; /* خلفية رومانسية */
            color: #d32f2f;
            padding: 20px;
            height: 100vh; /* اجعل الخلفية تملأ الشاشة */
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
        }
        input {
            padding: 10px;
            font-size: 18px;
            margin: 10px;
            border: 2px solid #d32f2f;
            border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.8);
        }
        button {
            padding: 10px 15px;
            font-size: 18px;
            background-color: #ff4081;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #f50057;
        }
        p {
            font-size: 1.5em;
            margin-top: 20px;
            line-height: 1.6;
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>حيا بشيخ قلبي</h1>
    <input type="text" id="code" placeholder="أدخل الرقم السري">
    <button onclick="checkCode()">إرسال</button>
    <p id="message"></p>

    <script>
        function checkCode() {
            const code = document.getElementById('code').value;
            const message = document.getElementById('message');
            if (code === '22446688') {
                message.innerHTML = 'أحببببببببببببببببك يا قيس<br>' +
                                    'نفسي أقولها لك بكل الطرق<br>' +
                                    'وادعي الله انه يحفظك لي ي عمري<br>' +
                                    'ويديم لي وجهك الحسن قدام عيوني<br>' +
                                    'و الف حمد و شكر انني اكلمك الان وقدك خطييييبي<br>' +
                                    'وان شاء الله قريبا ب اذن ربي زوجي و اب أطفالي<br>' +
                                    'الله يسرع الأيام و اقدر اححححححححضنك<br>' +
                                    'و احبك احبك احبك ❤️‍🔥💋';
                message.style.color = '#8B0000';
            } else {
                message.textContent = 'رقم غير صحيح. حاول مرة أخرى.';
                message.style.color = '#d32f2f';
            }
        }
    </script>
</body>
</html>
